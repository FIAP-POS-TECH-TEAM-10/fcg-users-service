apiVersion: v1
kind: Secret
metadata:
  name: users-api-secret
  namespace: fcgames
type: Opaque
stringData:
  # Só para o cluster LOCAL (Kind/Docker Desktop) — valor de exemplo, troque. No EKS a
  # chave vem do Secret fcg-jwt gerado pelo Terraform (fcg-orchestration/infra/eks).
  jwt-key: "REPLACE_ME"
  db-connection: "Data Source=/data/users.db"
  rabbitmq-username: "REPLACE_ME"
  rabbitmq-password: "REPLACE_ME"
  admin-password: "REPLACE_ME"
